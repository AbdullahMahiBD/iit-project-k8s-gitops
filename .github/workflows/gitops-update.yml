name: Update GitOps Repository

on:
  workflow_run:
    workflows: ["Build, Push and Scan Docker Image"]
    types:
      - completed
    branches:
      - main

jobs:
  gitops-update:
    name: Update GitOps Repository
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout GitOps Repo
        uses: actions/checkout@v4
        with:
          repository: 'AbdullahMahiBD/workshop-gitops'
          token: ${{ secrets.GITOPS_PAT }}

      - name: Update Image Tag in deployment.yml
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${SHA:0:7}"
          sed -i "s|image: abdullahmahiofficial/devops-project:.*|image: abdullahmahiofficial/devops-project:${SHORT_SHA}|g" frontend/deployment.yml

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/deployment.yml
          git commit -m "chore: update image tag to ${{ github.event.workflow_run.head_sha }}" || exit 0
          git push