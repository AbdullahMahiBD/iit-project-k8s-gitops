name: Build, Push and Scan Docker Image

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: devops-project
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  sonarqube-analysis:
    name: SonarQube Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: sonarqube-analysis
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set short commit SHA
        id: commit
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.commit.outputs.sha }}
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  trivy-scan:
    name: Scan Docker Image with Trivy
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set short commit SHA
        id: commit
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # 1. Download official HTML template
      - name: Download Trivy HTML Template
        run: |
          wget https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl -O html.tpl

      # 2. Generate HTML Report
      - name: Generate HTML Vulnerability Report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.commit.outputs.sha }}
          format: 'template'
          template: '@html.tpl'
          output: 'trivy-report.html'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'

      # 3. Generate Table Report for Console & GitHub Job Summary
      - name: Generate Table Report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.commit.outputs.sha }}
          format: 'table'
          output: 'trivy-results.txt'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'

      # 4. Display Results in GitHub Actions UI Summary
      - name: Publish Trivy Summary to GitHub Actions
        if: always()
        run: |
          echo "### 🛡️ Trivy Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat trivy-results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # 5. Upload Reports as Downloadable Artifacts (HTML & TXT)
      - name: Upload Trivy HTML & TXT Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-reports-${{ steps.commit.outputs.sha }}
          path: |
            trivy-report.html
            trivy-results.txt
          retention-days: 14

  update-gitops:
    name: Update GitOps Repository
    runs-on: ubuntu-latest
    needs: trivy-scan
    steps:
      - name: Checkout GitOps Repo
        uses: actions/checkout@v4
        with:
          repository: 'AbdullahMahiBD/workshop-gitops'
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-repo

      - name: Update Image Tag in deployment.yml
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          sed -i "s|image: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:.*|image: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}|g" gitops-repo/frontend/deployment.yml

      - name: Commit and Push Changes
        run: |
          cd gitops-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/deployment.yml
          git commit -m "chore: auto-deploy commit ${GITHUB_SHA::7}" || exit 0
          git push