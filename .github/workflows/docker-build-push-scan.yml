name: Build, Push, Scan and Deploy Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: devops-project
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # =========================================================================
  # 1. SonarQube Static Application Security Testing (SAST)
  # =========================================================================
  sonarqube-analysis:
    name: SonarQube Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # =========================================================================
  # 2. Docker Image Build & Push to Docker Hub
  # =========================================================================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: sonarqube-analysis
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Short Git Commit SHA
        id: commit
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.commit.outputs.sha }}
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  # =========================================================================
  # 3. Trivy Security Scan & Live Web Dashboard Deployment
  # =========================================================================
  trivy-scan:
    name: Scan Docker Image with Trivy
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Short Git Commit SHA
        id: commit
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # Download official HTML template
      - name: Fetch HTML Template
        run: |
          wget -q https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl -O html.tpl

      # Generate index.html report
      - name: Generate HTML Vulnerability Report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.commit.outputs.sha }}
          format: 'template'
          template: '@html.tpl'
          output: 'index.html'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'

      # Generate Table report
      - name: Generate Table Report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.commit.outputs.sha }}
          format: 'table'
          output: 'trivy-results.txt'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'

      # Render Summary in GitHub Actions Web UI
      - name: Publish Trivy Summary to GitHub Actions
        if: always()
        run: |
          echo "### 🛡️ Trivy Container Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Scanned Image:** \`${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.commit.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat trivy-results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Deploy Live Report directly to your VM (https://trivy.iitju.tech)
      - name: Deploy Live Trivy Dashboard to VM
        uses: appleboy/scp-action@v0.1.7
        if: always()
        with:
          host: '4.193.81.34'
          username: 'IIIT'
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'index.html'
          target: '/var/www/trivy-reports/'
          strip_components: 0

      # Upload Artifacts
      - name: Upload Trivy Security Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-reports-${{ steps.commit.outputs.sha }}
          path: |
            index.html
            trivy-results.txt
          retention-days: 14

  # =========================================================================
  # 4. GitOps Auto-Update (ArgoCD Auto-Deployment)
  # =========================================================================
  update-gitops:
    name: Update GitOps Repository
    runs-on: ubuntu-latest
    needs: trivy-scan
    steps:
      - name: Checkout GitOps Repo
        uses: actions/checkout@v4
        with:
          repository: 'AbdullahMahiBD/workshop-gitops'
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-repo

      - name: Update Image Tag in deployment.yml
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          sed -i "s|image: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:.*|image: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}|g" gitops-repo/frontend/deployment.yml

      - name: Commit and Push to GitOps Repo
        run: |
          cd gitops-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/deployment.yml
          git commit -m "chore: auto-deploy commit ${GITHUB_SHA::7}" || exit 0
          git push